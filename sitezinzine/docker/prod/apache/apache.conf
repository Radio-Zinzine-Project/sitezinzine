<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <Directory /var/www/html/public/images>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias "/uploads/emissionsMp3/" "/srv/zinzine/audio/library/"

    <Directory /srv/zinzine/audio>
        Require all denied
    </Directory>

    <Directory /srv/zinzine/audio/library>
        Options None
        AllowOverride None
        Require all granted
        FallbackResource disabled
        php_admin_flag engine Off

        <FilesMatch "(?i)\.(?:php[0-9]*|phtml|phar|phps)(?:\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>